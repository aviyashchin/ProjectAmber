<!DOCTYPE html>

<html lang="en-US">

<head>
  <link rel="stylesheet" type="text/css" href="styles.css" media="screen" />
  <title>Project Amber</title>
  <meta name="keywords" content="sand, falling, game" />
  <meta name="description" content="Project Amber: A modern version of the classic Hell of Sand Falling Game" />
  <meta name="subject" content="Project Amber" />
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>

<div class="wrapper" id="gameWrapper">
  <div id="titleWrapper">
    <h1 class="title">Project Amber</h1>
  </div>

  <canvas id="mainCanvas">Your browser doesn't support HTML5 canvas.</canvas>
  <div id="menuWrapper">
    <div id="elementPalette"></div>
    <div id="infoPanel" class="infoPanel">
      <div id="elementInfo" class="infoCard">
        <h2 class="infoHeading">Element Info</h2>
        <div id="elementInfoName" class="infoName">Sand</div>
        <div id="elementInfoDesc" class="infoDesc">Falls and piles up.</div>
      </div>
      <div id="worldIdeas" class="infoCard">
        <h2 class="infoHeading">World Ideas</h2>
      </div>
    </div>
    <div id="optionsCol1" class="optionsCol">
      <div id="penSizeDiv">
        <label for="pensize">Pen Size</label>
        <select id="pensize"></select>
      </div>
      <div>
        <select id="spigot1Type" class="spigotType"></select>
        <select id="spigot1Size"></select>
      </div>
      <div>
        <select id="spigot2Type" class="spigotType"></select>
        <select id="spigot2Size"></select>
      </div>
      <div>
        <select id="spigot3Type" class="spigotType"></select>
        <select id="spigot3Size"></select>
      </div>
      <div>
        <select id="spigot4Type" class="spigotType"></select>
        <select id="spigot4Size"></select>
      </div>
    </div>
    <div id="optionsCol2" class="optionsCol">
      <div>
        <label for="overwriteCheckbox">Overwrite</label>
        <input type="checkbox" id="overwriteCheckbox">
      </div>
      <div>
        <label for="borderCheckbox">Border</label>
        <input type="checkbox" id="borderCheckbox" checked>
      </div>
      <div id="speedSliderDiv">
        <label for="speedSlider">Speed</label>
        <input type="range" id="speedSlider">
      </div>
      <div id="zombieSliderDiv">
        <label for="zombieSlider">Zombies</label>
        <input type="range" id="zombieSlider">
        <span id="zombieCount">0</span>
      </div>
      <div class="optionButtonContainer">
        <input id="saveButton" class="optionButton" type="button" value="Save">
        <input id="loadButton" class="optionButton" type="button" value="Load">
      </div>
      <div id="clearButtonDiv" class="optionButtonContainer">
        <input id="clearButton" class="optionButton" type="button" value="Clear">
      </div>
    </div>
    <div id="tiltDebugPanel" class="infoCard optionsCol tiltDebugCard">
      <h2 class="infoHeading">Tilt Debug</h2>
      <div class="tiltDebugControls">
        <label for="tiltModeCheckbox">Tilt</label>
        <input type="checkbox" id="tiltModeCheckbox">
      </div>
      <div class="tiltDebugControls tiltDebugRow">
        <label for="tiltBucketSlider">Bucket</label>
        <input type="range" id="tiltBucketSlider" min="0" max="31" value="0">
        <span id="tiltBucketValue">0</span>
      </div>
      <div class="tiltDebugControls tiltDebugRow">
        <label for="tiltStrengthSlider">Strength</label>
        <input type="range" id="tiltStrengthSlider" min="0" max="100" value="100">
        <span id="tiltStrengthValue">1.00</span>
      </div>
      <div class="tiltDebugButtonGrid tiltDebugButtons">
        <input id="tiltDirectionDownButton" class="optionButton" type="button" value="Down">
        <input id="tiltDirectionDownRightButton" class="optionButton" type="button" value="Down-Right">
        <input id="tiltDirectionRightButton" class="optionButton" type="button" value="Right">
        <input id="tiltDirectionUpRightButton" class="optionButton" type="button" value="Up-Right">
      </div>
      <div class="tiltDebugButtonGrid tiltDebugButtons">
        <input id="tiltSceneSandButton" class="optionButton" type="button" value="Sand">
        <input id="tiltSceneMixedButton" class="optionButton" type="button" value="Mixed">
        <input id="tiltSceneGasButton" class="optionButton" type="button" value="Gas">
        <input id="tiltSceneClearButton" class="optionButton" type="button" value="Clear">
      </div>
    </div>
    <div id="fps-counter">
    </div>
  </div>
</div>

<script type="text/javascript" src="scripts/third_party/matter.min.js"></script>
<script type="text/javascript" src="scripts/util.js"></script>
<script type="text/javascript" src="scripts/canvasConfig.js"></script>
<script type="text/javascript" src="scripts/cursor.js"></script>
<script type="text/javascript" src="scripts/particles.js"></script>
<script type="text/javascript" src="scripts/elements.js"></script>
<script type="text/javascript" src="scripts/spigots.js"></script>
<script type="text/javascript" src="scripts/menu.js"></script>
<script type="text/javascript" src="scripts/tooltips.js"></script>
<script type="text/javascript" src="scripts/softBody.js"></script>
<script type="text/javascript" src="scripts/zombies.js"></script>
<script type="text/javascript" src="scripts/game.js"></script>

</html>
